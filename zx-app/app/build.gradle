plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zx.zola'
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.zx.zola"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake { cppFlags "-std=c++20 -fvisibility=hidden -fstack-protector-strong" }
        }
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // ZX_RELEASE suppresses all logcat output; -O3 handled by CMakeLists.txt
        }
        debug {
            // intentionally no cppFlags override — debug gets base flags only
        }
    }

    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" }
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    buildFeatures { viewBinding true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
}
