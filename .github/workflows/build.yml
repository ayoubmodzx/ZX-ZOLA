name: Build ZX-ZOLA APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install NDK and CMake via sdkmanager
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "y" | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > zx-app/local.properties

      - name: Make gradlew executable
        run: chmod +x zx-app/gradlew

      - name: Build Debug APK
        run: |
          cd zx-app
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ZX-ZOLA-debug
          path: zx-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

      - name: Release dev build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "ZX Dev Build (latest)"
          prerelease: true
          files: zx-app/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
