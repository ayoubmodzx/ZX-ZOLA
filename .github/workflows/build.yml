name: Build ZX-ZOLA APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "NDK_VERSION=27.2.12479018" >> $GITHUB_ENV

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > zx-app/local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> zx-app/local.properties

      - name: Make gradlew executable
        run: chmod +x zx-app/gradlew

      - name: Build Debug APK
        run: |
          cd zx-app
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZX-ZOLA-debug
          path: zx-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on main branch push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "ZX-ZOLA Build ${{ github.run_number }}"
          files: zx-app/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
